name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required for gh release create

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Flutter version
        id: flutter-version
        run: |
          FLUTTER_VERSION=$(sed -n -E "s/^\s*flutter:\s+(.*)/\1/p" chess_app/pubspec.yaml)
          echo "version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/chess3000.jks"

      - name: Compute versionCode and patch pubspec.yaml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          VERSION_CODE=$((MAJOR*10000 + MINOR*100 + PATCH))
          sed -i "s/^version: .*/version: $VERSION+$VERSION_CODE/" chess_app/pubspec.yaml
          echo "Patched pubspec.yaml to version: $VERSION+$VERSION_CODE"

      - name: Flutter pub get
        working-directory: chess_app
        run: flutter pub get

      - name: Flutter test
        working-directory: chess_app
        run: flutter test

      - name: Build release APK
        working-directory: chess_app
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/chess3000.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            chess_app/build/app/outputs/flutter-apk/app-release.apk \
            --title "Chess3000 $TAG" \
            --generate-notes
