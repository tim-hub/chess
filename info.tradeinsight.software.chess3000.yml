Categories:
  - Games
License: GPL-3.0-only
SourceCode: https://github.com/tim-hub/chess
IssueTracker: https://github.com/tim-hub/chess/issues

AutoName: Chess3000

RepoType: git
Repo: https://github.com/tim-hub/chess

Builds:
  - versionName: 1.0.5
    versionCode: 10005
    commit: f21f95d559f4edaa7b29e4e8fc8b07cae9d8f36c
    subdir: chess_app
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - chess_app/ios
      - chess_app/macos
    prebuild:
      - flutterVersion=$(sed -n -E 's/^\s+flutter:\s+(.*)/\1/p' pubspec.yaml)
      - "[[ $flutterVersion ]]"
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - chess_app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm64

Binaries: https://github.com/tim-hub/chess/releases/download/v%v/app-release.apk
AllowedAPKSigningKeys: c5117a80680a7d3e630fda409b8a61968bf3e2bb00fcf1f82c77bfa90b0e2227

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: chess_app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
