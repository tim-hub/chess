Categories:
  - Games
License: GPL-3.0-only
SourceCode: https://github.com/tim-hub/chess
IssueTracker: https://github.com/tim-hub/chess/issues

AutoName: Chess3000

RepoType: git
Repo: https://github.com/tim-hub/chess

Builds:
  - versionName: 1.0.4
    versionCode: 10004
    commit: 401e273ad44ef8a6a60462cd69b56180107eb581
    subdir: chess_app
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - chess_app/ios
      - chess_app/macos
    prebuild:
      - flutterVersion=$(sed -n -E 's/^\s+flutter:\s+(.*)/\1/p' pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - chess_app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm64

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: chess_app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.4
CurrentVersionCode: 10004
